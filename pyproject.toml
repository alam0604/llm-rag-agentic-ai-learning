[project]
name = "ailearn"
version = "1.0.0"
description = "Learn LLMs, RAG and Agentic AI by building the pieces from scratch"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.7"]
graph = ["langgraph>=0.3", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
real = ["openai>=1.0", "anthropic>=0.30", "sentence-transformers>=2.7", "chromadb>=0.5"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
